<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Keycap Bevel -->
    <linearGradient id="key-bevel-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Keycap Surface -->
    <linearGradient id="key-surface-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Swipe Glow Gradient -->
    <linearGradient id="swipe-cyan-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <!-- Trail Gradient -->
    <linearGradient id="trail-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="70%" stop-color="#4FACFE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow-1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-1)" />

  <!-- Pixel Grid Tech Lines -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- 3D Keycap Object -->
  <g filter="url(#soft-shadow-1)">
    <!-- Base Body (Bevel) -->
    <rect x="116" y="140" width="280" height="240" rx="44" fill="url(#key-bevel-1)" />
    
    <!-- Top Concave Face -->
    <rect x="138" y="132" width="236" height="206" rx="36" fill="url(#key-surface-1)" stroke="#475569" stroke-width="2" stroke-opacity="0.7" />

    <!-- Surface Top Edge Highlight -->
    <path d="M 166 142 Q 256 135 346 142" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Key Modifier Label "CTRL" -->
  <text x="160" y="182" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#64748B" letter-spacing="2">CTRL</text>

  <!-- Motion Swipe Waves -->
  <g opacity="0.85">
    <path d="M 80 236 L 220 236" stroke="url(#trail-grad-1)" stroke-width="7" stroke-linecap="round" />
    <path d="M 50 256 L 260 256" stroke="url(#trail-grad-1)" stroke-width="12" stroke-linecap="round" />
    <path d="M 90 276 L 210 276" stroke="url(#trail-grad-1)" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- Dynamic Glowing Swipe Arrow -->
  <g filter="url(#glow-1)">
    <!-- Arrow Stem & Head -->
    <path d="M 180 256 L 330 256" stroke="url(#swipe-cyan-1)" stroke-width="24" stroke-linecap="round" />
    <path d="M 285 210 L 345 256 L 285 302" stroke="url(#swipe-cyan-1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Upward Swipe Indicator (Ctrl+Up) -->
    <path d="M 256 200 L 256 166 M 242 178 L 256 164 L 270 178" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
  </g>

  <!-- Energy Pulse Dots -->
  <circle cx="345" cy="256" r="6" fill="#FFFFFF" />
  <circle cx="345" cy="256" r="16" fill="#00F2FE" opacity="0.4" />
</svg>
